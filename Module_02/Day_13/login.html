<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>
        Login
    </h1>

    <form action="/login" method="POST">
        <label
            for="email">Email</label>

            <input 
            type="email"
            id="email"
            name="email"
            required
            >
            <br><br>

            <label for="password">Password</label><br>
            <input 
            type="password"
            id="password"
            name="password"
            required>

            <br><br>

            <button type="submit">Login</button>

            <p>Don't have an account?</p>

<a href="signup.html">Create Account</a>

    </form>
</body>
</html>
