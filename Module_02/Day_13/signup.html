<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
</head>
<body>

<h1>Sign Up</h1>

<form action="/signup" method="POST">

    <label for="fullname">Full Name:</label>
    <input
        type="text"
        id="fullname"
        name="fullname"
        required>

    <br><br>

    <label for="email">Email:</label>
    <input
        type="email"
        id="email"
        name="email"
        required>

    <br><br>

    <label for="password">Password:</label>
    <input
        type="password"
        id="password"
        name="password"
        required>

    <br><br>

    <label for="confirmPassword">Confirm Password:</label>
    <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        required>

    <br><br>

    <button type="submit">Create Account</button>

    <p>Already have an account?</p>
    <a href="login.html">Login</a>

</form>

</body>
</html>
