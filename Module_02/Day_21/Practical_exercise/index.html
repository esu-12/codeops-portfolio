<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Signup</h1>

    <!-- Theme Toggle -->
    <button id="themeBtn" type="button">
        Toggle Theme
    </button>

    <form id="signupForm">

        <label for="name">Name</label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >

        <label for="phone">Phone</label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="+251948027314"
            required
        >

        <button type="submit">
            Sign Up
        </button>

        <p id="error"></p>

    </form>

    <p id="count"></p>

    <script src="app.js"></script>

</body>
</html>
